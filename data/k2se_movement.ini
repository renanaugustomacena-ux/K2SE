; K2SE movement features (K2 Jump / Crouch / Sprint) -- copy this file next to swkotor2.exe.
; Delete it to switch every feature off. Keys: LSHIFT LALT LCTRL SPACE TAB C N F9 ... or 0x41.
;
; Space and C are bound by the game to Pause (action241) and ActionRight (action281b).
; `python tools/deploy_movement.py --remap-keys` moves them (Pause -> F9, ActionLeft/Right -> arrows)
; with a backup of swkotor2.ini; or do it in Options -> Key Mapping. The DLL logs conflicts at start.

[Sprint]
Enabled=1
AlwaysOn=0            ; 1 = sprint senza tenere il tasto (solo per l'esperimento S1)
Key=LSHIFT
Factor=1.6
RampSeconds=0.25
AllowInCombat=0
MaxTotalFactor=2.5
CancelCrouch=1

[Crouch]
Enabled=0
Key=C
Toggle=1
ExitOnCombat=1

[Jump]
Enabled=0
Key=SPACE
Height=1.0
MaxDistance=2.5
AllowInCombat=0
Cooldown=0.4
PlaceholderAnim=0     ; 1 = usa diveroll come animazione del salto (sembra una capriola: sconsigliato)
ClientLift=0          ; esperimento S1: scrive l'altezza del salto anche nelle copie client della posizione trovate dalla scansione

[Roll]
Enabled=0
Key=LALT
Cooldown=1.0
Boost=1.3
BoostSeconds=0.6
AllowInCombat=0

[Directional]
Enabled=0             ; WASD = movimento a 8 direzioni relativo alla camera (come lo stick)
KeyForward=W
KeyBack=S
KeyLeft=A             ; richiede --remap-keys: la rotazione camera del gioco passa a Numpad4/6
KeyRight=D
InvertStrafe=0        ; 1 se A/D risultano invertiti
InvertForward=0

[FOV]
Enabled=0             ; k2-multi-fov: FOV verticale in gradi (il gioco usa 45). Fuori dal gameplay resta quello del gioco.
Exploration=60
Combat=55
SprintAdd=5           ; gradi aggiunti mentre si sprinta
SmoothSeconds=0.35
KeyIncrease=ADD       ; Numpad +
KeyDecrease=SUBTRACT  ; Numpad -
KeyReset=MULTIPLY     ; Numpad *
Step=2.5
Min=30
Max=110
Banner=1              ; mostra il valore a schermo quando cambia

[Camera]
Enabled=0             ; tre visuali sulla camera d'inseguimento: vicina, lontana, prima persona (il movimento resta attivo)
KeyCycle=N            ; tasto libero nel gioco; cicla vicina -> lontana -> prima persona
StartView=1           ; 1 vicina, 2 lontana, 3 prima persona, 0 stile del gioco
IncludeGameStyle=0    ; 1 = nel ciclo entra anche lo stile del gioco (camerastyle.2da)
Banner=1

[CameraNear]
Distance=2.2          ; il gioco: 3.2 (DEFAULT), 1.3 (Ebon Hawk), 6.25 (OutDoor)
Height=0.6            ; il gioco: 0.45
Pitch=83              ; il gioco: 83
FOV=60                ; verticale; il gioco: 55

[CameraFar]
Distance=5.5
Height=1.4
Pitch=80
FOV=52

[CameraFirstPerson]
; ATTENZIONE: Distance e Height qui NON sono dove finisce la camera. Con
; [FirstPerson] Enabled=1 la posizione viene sovrascritta con il punto occhio
; misurato. Questi due valori servono solo a far calcolare al motore una
; DIREZIONE di sguardo orizzontale: mirando dai piedi a 2 m di distanza lo
; sguardo e' livellato, mentre a 5 cm e 1.67 m puntava quasi a terra.
Distance=2.0
Height=0.0            ; vedi sopra: l'altezza reale e' quella misurata dal modello
Pitch=90              ; orizzontale
FOV=75
NearPlane=0.35        ; taglia via testa e busto del personaggio intorno alla camera

[FirstPerson]
; Camera in prima persona ancorata agli OCCHI del modello, non a un'altezza fissa.
; Misure in k2-multi-fov/docs/eye-measurements.md: gli occhi del PC maschio sono
; a 1.6726 m e quelli della femmina a 1.5886 m, quindi il vecchio 1.65 fisso era
; 1.9 cm troppo basso per gli uni e 6.0 cm troppo alto per le altre.
Enabled=0
Anchor=0              ; 0 occhi (eyeLA/eyeRA)  1 headhook  2 camerahook  3 solo misura statica
BobScale=0.25         ; 0 = testa immobile, 1 = osso della testa grezzo (nausea garantita)
BobDamping=0.85       ; costante del filtro: piu' alta = piu' lento e piu' morbido
MaxJump=0.5           ; m; uno spostamento maggiore in un frame e' un teletrasporto, si rifiuta
ForwardOffset=0.0     ; m; + sposta la camera in avanti rispetto agli occhi
EyeHeightOverride=0   ; m; >0 forza un'altezza e ignora la misura
LockDirection=0       ; 1 = forza lo sguardo orizzontale nella direzione del
                      ;     personaggio. Usalo SE la prima persona guarda a terra:
                      ;     toglie il guardarsi intorno, ma raddrizza la vista.
Probe=0               ; 1 = una tantum: cerca i nodi nel modello vivo e scrive tutto nel log.
                      ; Chiama slot di vtable il cui layout non e' ancora accertato:
                      ; tienilo a 0 salvo quando serve raccogliere i dati.

[Render]
; Livello di estensione del renderer. Il motore e' OpenGL 1.x a funzione fissa
; con shader ARB_fragment_program: si possono cambiare gli shader e aggiungere
; una passata di post-processing, NON si ottengono PBR o ray tracing senza
; riscrivere il renderer. E non esiste un motore fisico da estendere: KOTOR ha
; solo la walkmesh.
Enabled=0
; --- shader ---
; DumpShaders scrive ogni fragment program del gioco in k2se_shaders\<hash>.fp.
; ReplaceShaders rilegge quei file: modificane uno e il gioco usa il tuo.
; Questo e' cio' che rende il renderer modificabile; tutto il resto ci sta sopra.
DumpShaders=0
ReplaceShaders=0
; --- post-processing (una passata a fine frame, su SwapBuffers) ---
PostProcess=0
Brightness=1.0        ; 0.1..3.0
Contrast=1.0          ; 0.1..3.0
Saturation=1.0        ; 0 grigio, 1 invariato, >1 piu' carico
TintR=1.0
TintG=1.0
TintB=1.0             ; es. 1.02/1.0/0.96 per un tono piu' caldo
Sharpen=0.0           ; 0..1; su un gioco del 2004 anche 0.2 si vede

[Spawner]
Enabled=0             ; popola le aree con placeable e NPC da k2se_spawns\<MODULO>.ini (vedi k2se_spawns\README.txt)
Script=k2se_spawn     ; override\k2se_spawn.ncs, eseguito da K2SE dopo ogni cambio area e ogni PollSeconds
PollSeconds=4
AreaDelaySeconds=1
KeyCapture=F11        ; salva la posizione del giocatore come blocco [spawnN] in k2se_spawns\_captured.txt.
                      ; Era F10: adesso F10 apre la console, che fa la stessa cosa ma meglio.
Banner=1

[Console]
; Finestra di console vera per sfogliare e piazzare oggetti. Il gioco continua
; a girare: si scrive nella console, l'oggetto compare in gioco entro qualche
; secondo (la passata di spawn e' periodica, vedi PollSeconds qui sopra).
; Richiede [Spawner] Enabled=1, ed e' l'unico modo per piazzare qualcosa.
; Serve il gioco in finestra o borderless: a schermo intero esclusivo non si
; riesce ad alt-tab sulla console senza minimizzare.
; Il catalogo (1348 oggetti) sta in k2se_catalog.csv accanto all'exe, generato
; da tools/gen_catalog.py e copiato dal deploy.
Enabled=0
KeyToggle=F10         ; apre/chiude la console
InGame=1              ; 1 = disegnata SOPRA il gioco (nessuna finestra separata,
                      ;     nessun alt-tab, funziona a schermo intero).
                      ; 0 = finestra di console separata, richiede il gioco in finestra.
OpenAtStart=0         ; 1 = aprila subito al caricamento

[NpcVariety]
Enabled=0             ; gli NPC generici (cittadini, ufficiali Czerka, soldati/ufficiali Repubblica) ricevono teste diverse
Chance=100            ; percentuale di NPC generici che cambiano aspetto (deterministico per NPC)

[Debug]
Banner=0
LogTransitions=1
